<?xml version="1.0" encoding="UTF-8"?>
<svg class="journey-diagram" viewBox="0 0 1432 450" role="img" aria-label="Luồng đề xuất: QR mở web, khách chọn camera hoặc danh mục 3D, rồi khám phá hiện vật và nội dung" xmlns="http://www.w3.org/2000/svg"><style>.diagram-edge{fill:none;stroke:#86602e;stroke-width:3}.diagram-node{fill:#e5ddca;stroke:#bca77d;stroke-width:1.5}.diagram-node-dark{fill:#223329;stroke:#a78d57;stroke-width:1.5}.diagram-node-gate{fill:#d8b574;stroke:#f0d49d;stroke-width:2}.diagram-text{font-family:Segoe UI,Arial,sans-serif;fill:#131c18;font-size:29px;font-weight:600;text-anchor:middle}.diagram-label{font-family:Segoe UI,Arial,sans-serif;fill:#506154;font-size:24px;text-anchor:middle}.diagram-text-white{fill:#f3efe4}.diagram-label-white{fill:#c1c9bf}</style><rect width="100%" height="100%" fill="#f3efe4"></rect>
  <defs><marker id="journey-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#86602e"></path></marker></defs>
  <g class="diagram-edge" marker-end="url(#journey-arrow)">
    <path d="M220,224 H300"></path><path d="M500,224 H570 V94 H645"></path><path d="M570,224 V354 H645"></path>
    <path d="M885,94 H954 V224 H1025"></path><path d="M885,354 H954 V224"></path>
  </g>
  <rect x="0" y="169" width="220" height="110" rx="6" class="diagram-node"></rect><text x="110" y="214" class="diagram-text ">Quét QR</text><text x="110" y="251" class="diagram-label ">Điểm vào dự kiến</text>
  <rect x="300" y="169" width="200" height="110" rx="6" class="diagram-node"></rect><text x="400" y="214" class="diagram-text ">Mở web</text><text x="400" y="251" class="diagram-label ">Trên trình duyệt</text>
  <rect x="645" y="39" width="240" height="110" rx="6" class="diagram-node"></rect><text x="765" y="84" class="diagram-text ">Chế độ camera</text><text x="765" y="121" class="diagram-label ">Khi khách cho phép</text>
  <rect x="645" y="299" width="240" height="110" rx="6" class="diagram-node"></rect><text x="765" y="344" class="diagram-text ">Danh mục 3D</text><text x="765" y="381" class="diagram-label ">Không cần camera</text>
  <rect x="1025" y="169" width="405" height="110" rx="6" class="diagram-node"></rect><text x="1227.5" y="214" class="diagram-text ">Khám phá hiện vật</text><text x="1227.5" y="251" class="diagram-label ">Câu chuyện · audio · đố vui</text>
  <text x="765" y="225" class="diagram-label">Khách chọn cách bắt đầu</text>
</svg>