<?xml version="1.0" encoding="UTF-8"?>
<svg class="workflow-diagram" viewBox="0 0 1432 490" role="img" aria-label="Kiến trúc đề xuất: tư liệu vào AI biên soạn, tạo media, người duyệt phê duyệt, xuất tệp lên kho CDN và khách truy cập bằng web" xmlns="http://www.w3.org/2000/svg"><style>.diagram-edge{fill:none;stroke:#86602e;stroke-width:3}.diagram-node{fill:#e5ddca;stroke:#bca77d;stroke-width:1.5}.diagram-node-dark{fill:#223329;stroke:#a78d57;stroke-width:1.5}.diagram-node-gate{fill:#d8b574;stroke:#f0d49d;stroke-width:2}.diagram-text{font-family:Segoe UI,Arial,sans-serif;fill:#131c18;font-size:29px;font-weight:600;text-anchor:middle}.diagram-label{font-family:Segoe UI,Arial,sans-serif;fill:#506154;font-size:24px;text-anchor:middle}.diagram-text-white{fill:#f3efe4}.diagram-label-white{fill:#c1c9bf}</style><rect width="100%" height="100%" fill="#101713"></rect>
  <defs><marker id="system-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dcb779"></path></marker></defs>
  <g fill="none" stroke="#dcb779" stroke-width="3" marker-end="url(#system-arrow)">
    <path d="M250,120 H325"></path><path d="M575,120 H650"></path><path d="M965,120 H1045"></path>
    <path d="M1235,175 V255 H175 V330"></path><path d="M345,390 H440"></path><path d="M770,390 H865"></path><path d="M1135,390 H1210"></path>
  </g>
  <rect x="0" y="65" width="250" height="110" rx="6" class="diagram-node-dark"></rect><text x="125" y="110" class="diagram-text diagram-text-white">Ảnh + tư liệu</text><text x="125" y="147" class="diagram-label diagram-label-white">Tư liệu hiện vật</text>
  <rect x="325" y="65" width="250" height="110" rx="6" class="diagram-node-dark"></rect><text x="450" y="110" class="diagram-text diagram-text-white">AI soạn kịch bản</text><text x="450" y="147" class="diagram-label diagram-label-white">Nội dung + ngữ cảnh</text>
  <rect x="650" y="65" width="315" height="110" rx="6" class="diagram-node-dark"></rect><text x="807.5" y="110" class="diagram-text diagram-text-white">Tạo tài nguyên</text><text x="807.5" y="147" class="diagram-label diagram-label-white">3D · video · giọng đọc</text>
  <rect x="1045" y="65" width="380" height="110" rx="6" class="diagram-node-gate"></rect>
  <text x="1235" y="110" class="diagram-text">Người duyệt phê duyệt</text><text x="1235" y="147" class="diagram-label">Sử liệu · lời dẫn · minh họa</text>
  <rect x="0" y="330" width="345" height="110" rx="6" class="diagram-node-dark"></rect><text x="172.5" y="375" class="diagram-text diagram-text-white">Xuất bản được duyệt</text><text x="172.5" y="412" class="diagram-label diagram-label-white">Tạo gói tài nguyên tĩnh</text>
  <rect x="440" y="330" width="330" height="110" rx="6" class="diagram-node-dark"></rect><text x="605" y="375" class="diagram-text diagram-text-white">Kho media / CDN</text><text x="605" y="412" class="diagram-label diagram-label-white">Phân phối theo phiên bản</text>
  <rect x="865" y="330" width="270" height="110" rx="6" class="diagram-node-dark"></rect><text x="1000" y="375" class="diagram-text diagram-text-white">Web của khách</text><text x="1000" y="412" class="diagram-label diagram-label-white">3D + audio + tương tác</text>
  <rect x="1210" y="330" width="215" height="110" rx="6" class="diagram-node-dark"></rect><text x="1317.5" y="375" class="diagram-text diagram-text-white">Đo thử nghiệm</text><text x="1317.5" y="412" class="diagram-label diagram-label-white">Phản hồi sử dụng</text>
  <text x="0" y="28" fill="#dcb779" font-family="Segoe UI,Arial,sans-serif" font-size="23">BIÊN SOẠN &amp; KIỂM DUYỆT</text>
  <text x="440" y="300" fill="#dcb779" font-family="Segoe UI,Arial,sans-serif" font-size="23">XUẤT BẢN &amp; TRẢI NGHIỆM</text>
</svg>