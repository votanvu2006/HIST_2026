<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HeritageXR Studio — HIST 2026</title>
  <link rel="stylesheet" href="slides.css">
</head>
<body>
  <main id="stage" aria-label="Bộ slide HeritageXR Studio"></main>
  <nav class="toolbar" aria-label="Điều khiển trình chiếu">
    <button id="previous" aria-label="Slide trước">←</button>
    <span id="counter" aria-live="polite"></span>
    <button id="next" aria-label="Slide sau">→</button>
    <button id="notes-toggle" aria-pressed="false">Ghi chú</button>
    <button id="fullscreen">Toàn màn hình</button>
    <button id="print">In / PDF</button>
  </nav>
  <aside id="notes" hidden aria-label="Ghi chú thuyết trình"></aside>
  <script src="slides.js"></script>
</body>
</html>
